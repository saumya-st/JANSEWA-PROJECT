name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # The Vite build needs no secrets: VITE_* values are read at build time
      # and fall back to empty strings, so the bundle compiles without a .env.
      - run: npm run build
